<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeroZhizni — Админ-панель</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--accent);
            text-align: center;
            letter-spacing: -1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .stat-card .label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .stat-card .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        .queue-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .queue-header {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .queue-item {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .queue-item:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .bird-info .name {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .bird-info .meta {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .actions button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-left: 8px;
            transition: 0.2s;
        }

        .actions button:hover {
            background: var(--accent);
            color: var(--bg-color);
        }

        .actions button.delete {
            color: var(--danger);
        }

        .actions button.delete:hover {
            background: var(--danger);
            color: white;
        }

        #loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>PeroZhizni Admin</h1>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="label">Опубликовано</span>
                <span id="stat-published" class="value">...</span>
            </div>
            <div class="stat-card">
                <span class="label">Статус бота</span>
                <span class="value" style="color: #22c55e;">Online</span>
            </div>
            <div class="stat-card">
                <span class="label">Мониторинг</span>
                <span class="value">Sentry ✅</span>
            </div>
        </div>

        <div class="queue-container">
            <div class="queue-header">
                <span>Очередь постов</span>
                <button onclick="fetchQueue()"
                    style="background:none; border:none; color:var(--accent); cursor:pointer; font-size:0.8rem;">Обновить</button>
            </div>
            <div id="queue-list">
                <div id="loading">Загрузка данных...</div>
            </div>
        </div>
    </div>

    <script>
        async function fetchQueue() {
            const list = document.getElementById('queue-list');
            try {
                console.log('Fetching queue from /api/admin/queue...');
                const response = await fetch('/api/admin/queue');

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const result = await response.json();
                console.log('Result:', result);

                if (result.success) {
                    displayQueue(result.data);
                    document.getElementById('stat-published').innerText = result.data.length;
                } else {
                    list.innerHTML = `<div id="loading" style="color:var(--danger)">Ошибка API: ${result.error}</div>`;
                }
            } catch (e) {
                console.error('Fetch error:', e);
                list.innerHTML = `<div id="loading" style="color:var(--danger)">Ошибка сети: ${e.message}</div>`;
            }
        }

        function displayQueue(birds) {
            const list = document.getElementById('queue-list');
            if (birds.length === 0) {
                list.innerHTML = '<div id="loading">Пока ничего не опубликовано</div>';
                return;
            }

            list.innerHTML = birds.map(bird => {
                const date = new Date(bird.posted_at).toLocaleString('ru-RU');
                return `
                    <div class="queue-item">
                        <div class="bird-info">
                            <div class="name">${bird.bird_name}</div>
                            <div class="meta">${date} • ID: ${bird.message_id}</div>
                        </div>
                        <div class="actions">
                            <button onclick="alert('Скоро появится: замена фото')">🖼 Изменить фото</button>
                            <button class="delete" onclick="alert('Используйте команду /delete в боте')">🗑 Удалить</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Автозагрузка
        fetchQueue();
    </script>
</body>

</html>
